name: build-emulationstation

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/build-es.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build EmulationStation for armv7 (qemu)
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/work" -w /work \
            arm32v7/debian:bookworm bash -lc '
              set -e
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                build-essential cmake git libsdl2-dev libsdl2-image-dev \
                libsdl2-mixer-dev libsdl2-ttf-dev libfreeimage-dev \
                libfreetype-dev libcurl4-openssl-dev rapidjson-dev \
                libpugixml-dev libvlc-dev
              git clone --depth 1 https://github.com/RetroPie/EmulationStation.git es
              cd es
              cmake -DCMAKE_BUILD_TYPE=Release . > /tmp/cmake.log 2>&1 || { tail -50 /tmp/cmake.log; exit 1; }
              make -j"$(nproc)" > /tmp/make.log 2>&1 || { tail -80 /tmp/make.log; exit 1; }
              ls -l emulationstation
              cp emulationstation /work/emulationstation
            '

      - name: Package
        run: |
          mkdir -p out
          cp emulationstation out/ || true
          tar czf out/emulationstation-armv7.tar.gz -C out emulationstation
          cd out && sha256sum * > SHA256SUMS && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: emulationstation-armv7
          path: out/
          retention-days: 30
