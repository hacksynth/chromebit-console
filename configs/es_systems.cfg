<?xml version="1.0"?>
<!--
  EmulationStation system list for the Chromebit console.
  ROMs live on the NAS, mounted at /mnt/nas/roms (see nas-roms.mount).
  Every system launches a libretro core through RetroArch.
-->
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/mnt/nas/roms/nes</path>
    <extension>.nes .NES .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/nestopia_libretro.so %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>
  <system>
    <name>snes</name>
    <fullname>Super Nintendo</fullname>
    <path>/mnt/nas/roms/snes</path>
    <extension>.smc .SMC .sfc .SFC .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/snes9x_libretro.so %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
  </system>
  <system>
    <name>megadrive</name>
    <fullname>Mega Drive / Genesis</fullname>
    <path>/mnt/nas/roms/megadrive</path>
    <extension>.md .MD .gen .GEN .bin .BIN .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/genesis_plus_gx_libretro.so %ROM%</command>
    <platform>genesis</platform>
    <theme>megadrive</theme>
  </system>
  <system>
    <name>gb</name>
    <fullname>Game Boy</fullname>
    <path>/mnt/nas/roms/gb</path>
    <extension>.gb .GB .gbc .GBC .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/gambatte_libretro.so %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
  </system>
  <system>
    <name>gba</name>
    <fullname>Game Boy Advance</fullname>
    <path>/mnt/nas/roms/gba</path>
    <extension>.gba .GBA .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/mgba_libretro.so %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>
  <system>
    <name>psx</name>
    <fullname>PlayStation</fullname>
    <path>/mnt/nas/roms/psx</path>
    <extension>.cue .CUE .chd .CHD .pbp .PBP .iso .ISO .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/pcsx_rearmed_libretro.so %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
  </system>
  <system>
    <name>pcengine</name>
    <fullname>PC Engine / TurboGrafx-16</fullname>
    <path>/mnt/nas/roms/pcengine</path>
    <extension>.pce .PCE .zip .ZIP .7z</extension>
    <command>/usr/bin/retroarch -L /usr/lib/libretro/mednafen_pce_fast_libretro.so %ROM%</command>
    <platform>pcengine</platform>
    <theme>pcengine</theme>
  </system>
</systemList>
